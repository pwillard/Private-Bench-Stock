{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings</h1>
<form class="globalForms componentForm" method="post">
  {{ csrf() }}
  <fieldset>
    <legend>Preferences</legend>
    <label class="short">Currency
      <select name="currency">
        {% for cur in config.CURRENCIES %}<option {{ 'selected' if currency == cur }}>{{ cur }}</option>{% endfor %}
      </select></label>
  </fieldset>
  <div class="buttons"><button class="button green" type="submit"><span class="fa fa-save fa-lg"></span> Save</button></div>
</form>
<p><a class="button white" href="{{ url_for('components.export_csv') }}"><span class="fa fa-download"></span> Export all components (CSV)</a></p>
{% endblock %}
